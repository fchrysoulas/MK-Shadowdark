name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - chore/reproducible-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        if: github.ref == 'refs/heads/chore/reproducible-ci'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add npm lockfile"
          git push origin HEAD:chore/reproducible-ci

      - name: Syntax and manifest validation
        run: npm run syntax

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

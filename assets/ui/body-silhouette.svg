      <stop offset=".52" stop-color="#17352f" stop-opacity=".62"/>
      <stop offset="1" stop-color="#102924" stop-opacity=".68"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-20%" width="160%" height="140%">

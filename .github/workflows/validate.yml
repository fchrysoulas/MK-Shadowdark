name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax and manifest validation
        run: npm run syntax

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

name: Issue 27 Refactor

on:
  push:
    branches:
      - agent/issue-27-shared-sheet-render

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-27-shared-sheet-render
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded refactor
        run: node tools/apply-sheet-render-adapter-refactor.mjs
      - name: Validate transformed source
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run syntax
          npm run lint
          npm test
      - name: Commit transformed files
        run: |
          if git diff --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tests
          git commit -m "refactor character sheet render hooks"
          git push origin HEAD:agent/issue-27-shared-sheet-render

name: Issue 28 Refactor

on:
  push:
    branches:
      - agent/issue-28-quickdraw-render

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-28-quickdraw-render
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-issue-28-quickdraw-refactor.mjs
      - run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run syntax
          npm run lint
          npm test
      - name: Commit transformed Quickdraw source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          git commit -m "optimize Quickdraw sheet rendering"
          git push origin HEAD:agent/issue-28-quickdraw-render

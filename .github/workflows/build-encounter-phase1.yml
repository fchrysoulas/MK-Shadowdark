name: Build Encounter Engine

on:
  push:
    branches:
      - agent/encounter-engine-*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Encounter Engine JavaScript
        run: |
          for file in scripts/encounter-engine/*.js scripts/time-passes-splash.js; do
            node --check "$file"
          done

      - name: Validate module manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('module.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '1.1.1'
          system = manifest['relationships']['systems'][0]
          assert system['id'] == 'shadowdark'
          assert system['compatibility']['minimum'] == '3.5.0'
          for path in manifest.get('esmodules', []) + manifest.get('styles', []):
              assert Path(path).is_file(), f'Missing manifest file: {path}'
          PY

      - name: Build full module ZIP
        run: |
          mkdir -p dist
          zip -r dist/mk-shadowdark-1.1.1.zip . \
            -x '.git/*' '.github/*' 'dist/*'

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: mk-shadowdark-1.1.1
          path: dist/mk-shadowdark-1.1.1.zip
          if-no-files-found: error
          retention-days: 7

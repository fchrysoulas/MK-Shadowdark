name: Build Module

on:
  push:
    branches:
      - agent/encounter-engine-*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate module JavaScript
        run: |
          for file in scripts/*.js scripts/encounter-engine/*.js scripts/focus-spell-tracker/*.js scripts/group-sheet/*.js scripts/quickdraw/*.js; do
            node --check "$file"
          done

      - name: Read module version
        id: module
        run: |
          VERSION=$(node -p "require('./module.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate module manifest
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('module.json').read_text(encoding='utf-8'))
          assert re.fullmatch(r'\d+\.\d+\.\d+', manifest['version'])
          system = manifest['relationships']['systems'][0]
          assert system['id'] == 'shadowdark'
          assert system['compatibility']['minimum'] == '3.5.0'
          for path in manifest.get('esmodules', []) + manifest.get('styles', []):
              assert Path(path).is_file(), f'Missing manifest file: {path}'
          PY

      - name: Build full module ZIP
        run: |
          mkdir -p dist
          zip -r "dist/mk-shadowdark-${{ steps.module.outputs.version }}.zip" . \
            -x '.git/*' '.github/*' 'dist/*'

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: mk-shadowdark-${{ steps.module.outputs.version }}
          path: dist/mk-shadowdark-${{ steps.module.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7
